name: CI/CD Pipeline - PicoPark

on:
  push:
    branches: [ "main" ]

jobs:
  build-test-deploy:
    runs-on: self-hosted

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v4

      - name: 2. CI - Build y empaquetado de imagen Docker
        run: |
          docker build -t picopark:latest .

      - name: 3. Despliegue a entorno Staging
        run: |
          ./scripts/deploy.sh staging 3001 3003

      - name: 4. Tests de salud (Healthcheck) en Staging
        id: test_staging
        run: |
          for i in $(seq 1 15); do
            HEALTH=$(docker inspect --format='{{.State.Health.Status}}' picopark-staging 2>/dev/null || echo "starting")
            echo "Intento $i/15 - Estado Staging: $HEALTH"
            if [ "$HEALTH" = "healthy" ]; then
              echo "✅ Staging healthy (Nginx + WebSocket operativos)."
              exit 0
            fi
            sleep 2
          done
          echo "❌ Staging no superó el healthcheck."
          exit 1

      - name: 5a. Rollback en Staging si fallan los tests
        if: failure() && steps.test_staging.outcome == 'failure'
        run: |
          ./scripts/rollback.sh staging 3001 3003

      - name: 6. Promoción a Producción
        run: |
          ./scripts/deploy.sh production 3002 3000

      - name: 7. Verificación de salud (Healthcheck) en Producción
        id: test_prod
        run: |
          for i in $(seq 1 15); do
            HEALTH=$(docker inspect --format='{{.State.Health.Status}}' picopark-production 2>/dev/null || echo "starting")
            echo "Intento $i/15 - Estado Producción: $HEALTH"
            if [ "$HEALTH" = "healthy" ]; then
              echo "✅ Producción healthy (Nginx + WebSocket operativos)."
              exit 0
            fi
            sleep 2
          done
          echo "❌ Producción no superó el healthcheck."
          exit 1

      - name: 5b. Rollback en Producción si falla el despliegue
        if: failure() && steps.test_staging.outcome == 'success'
        run: |
          ./scripts/rollback.sh production 3002 3000

      - name: 8. Limpieza de entornos previos
        if: always()
        run: |
          ./scripts/cleanup.sh
