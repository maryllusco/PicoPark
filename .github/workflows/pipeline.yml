name: CI/CD Pipeline - PicoPark

on:
  push:
    branches: [ "main" ]

jobs:
  build-test-deploy:
    runs-on: self-hosted

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v4

      - name: 2. CI - Build y empaquetado de imagen Docker
        run: |
          echo "=== Construyendo imagen Docker (Bun + Nginx) ==="
          docker build -t picopark:latest .

      - name: 3. Despliegue a entorno Staging
        run: |
          ./scripts/deploy.sh staging 3001 3003

      - name: 4. Tests de validación en Staging
        id: test_staging
        run: |
          echo "=== Validando Staging (Web: 3001 | WS: 3003) ==="
          sleep 3
          WEB_STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:3001/ || true)
          WS_STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:3003/ || true)
          if [ "$WEB_STATUS" -ne 200 ] || [ "$WS_STATUS" -ne 200 ]; then
            echo "❌ Error en Staging (Web: $WEB_STATUS | WS: $WS_STATUS)"
            exit 1
          fi
          echo "✅ Staging validado correctamente (Web y WS activos)."

      - name: 5a. Rollback en Staging si fallan los tests
        if: failure() && steps.test_staging.outcome == 'failure'
        run: |
          ./scripts/rollback.sh staging 3001 3003

      - name: 6. Promoción a Producción (solo si Staging pasó)
        run: |
          echo "=== Promocionando a Producción (Web: 3002 | WS: 3000) ==="
          ./scripts/deploy.sh production 3002 3000

      - name: 7. Verificación de salud en Producción
        id: test_prod
        run: |
          sleep 3
          WEB_STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:3002/ || true)
          WS_STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:3000/ || true)
          if [ "$WEB_STATUS" -ne 200 ] || [ "$WS_STATUS" -ne 200 ]; then
            echo "❌ Error en Producción (Web: $WEB_STATUS | WS: $WS_STATUS)"
            exit 1
          fi
          echo "✅ Producción funcionando correctamente (Web y WS activos)."

      - name: 5b. Rollback en Producción si falla el despliegue o la verificación
        if: failure() && steps.test_staging.outcome == 'success'
        run: |
          ./scripts/rollback.sh production 3002 3000

      - name: 8. Limpieza de entornos previos
        if: always()
        run: |
          ./scripts/cleanup.sh
